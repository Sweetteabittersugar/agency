version: '3.8'
services:
  agency:
    build: .
    ports:
      - "${AGENCY_PORT:-8800}:${AGENCY_PORT:-8800}"
    volumes:
      - ./maestro/sessions:/app/maestro/sessions
      - ./maestro/worktrees:/app/maestro/worktrees
      - type: bind
        source: ./credentials
        target: /app/credentials
      - ./.env:/app/.env:ro
      - ./pricing.json:/app/pricing.json:ro
      - ./.claude/agents/user:/app/.claude/agents/user
      - ./.claude/skills/user:/app/.claude/skills/user
    environment:
      AGENCY_HOST: 0.0.0.0
      AGENCY_TOKEN: "${AGENCY_TOKEN:?set AGENCY_TOKEN in .env before starting Docker}"
    restart: unless-stopped
