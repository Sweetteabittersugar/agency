name: Feature request
description: Propose a bounded improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and compatibility impact
      description: Mention project access, credentials, network listeners, or durable runs if relevant.
