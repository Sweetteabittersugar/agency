name: Bug report
description: Report a reproducible Agency defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Remove secrets and private project data before submitting."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.5.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal commands, request payload, and observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or evidence
      description: Do not include API keys, tokens, or private source.
